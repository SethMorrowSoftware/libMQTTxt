# The compiler-free gates for libMQTTxt and its demo.
#
# WHY THIS FILE EXISTS: OXT has no headless way to compile or run a
# `.oxtstack` / `.livecodescript`, so nothing in CI can prove that this library
# LOADS or that the demo BUILDS ITS WINDOW. What CI can prove is everything
# that is pure computation or pure structure, and that is what runs here - each
# rule standing in for a compiler that cannot be run.
#
# Note the ORDER, which is the whole point of the first two steps: a gate that
# has gone blind reports OK, and OK is exactly what a blind gate and a clean
# tree look like from the outside. The mutation tests reintroduce each defect
# into a real copy of the tree and fail if the gate stays quiet, so they run
# BEFORE the gates whose output they make meaningful.
#
# tools/run-gates.sh runs this same set locally, in this same order.
name: gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anything; it reads the tree and exits.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- the gates that make the other gates mean something ---------------
      - name: gate discrimination (library)
        run: python3 tools/test-check-libmqttxt.py

      - name: gate discrimination (demo)
        run: python3 tools/test-demo-gates.py

      # --- the library ------------------------------------------------------
      - name: library static gate
        run: python3 tools/check-libmqttxt.py

      # The framing is pure computation, so it can be proved offline against
      # MQTT 3.1.1 byte sequences rather than against this library's own output.
      - name: MQTT 3.1.1 protocol vectors
        run: python3 tools/test-mqtt-vectors.py

      # The asynchronous write path rests on one property: the bytes reaching
      # the socket are the packets, in the order they were handed over. Break
      # it and a PINGREQ lands inside a half-written PUBLISH with no error on
      # either side. The queue's state machine is transcribed and driven
      # through the sequences that would break it.
      - name: outbound queue keeps order
        run: python3 tools/test-write-queue.py

      # --- the demo ---------------------------------------------------------
      # The demo carries the library, the UI kit and the boot self-check. Each
      # copy has a gate holding it identical to its master, because a demo that
      # is one paste-and-run file is a demo whose copies can go stale.
      - name: embedded library is current
        run: python3 tools/sync-demo-embeds.py --check

      - name: carried blocks are unchanged
        run: python3 tools/check-carried-blocks.py

      - name: control lists are derived from source
        run: python3 tools/check-demo-control-lists.py

      # Neither of these can be seen without an engine, which is why they are
      # gates: a control past the bottom edge and an unpinned delayed write
      # both fail silently at runtime.
      - name: layout fits its window
        run: python3 tools/check-demo-layout.py

      - name: delayed handlers pin a stack
        run: python3 tools/check-timer-stack-pin.py
